[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedinbot"
version = "0.1.0"
description = "AI destekli, kisisel LinkedIn is ilani kesif ve degerlendirme sistemi (bkz. LinkedInBot-PRD.md, LinkedInBot-TDD.md)"
requires-python = ">=3.12"
authors = [{ name = "Refik Saribiyik" }]

# TDD Section 2'de secilen bagimliliklar, onlari fiilen kullanan ilk milestone'da
# eklenir. Pydantic v2 (M1.1) ve SQLAlchemy 2.x + Alembic + psycopg (M1.2, TDD
# Section 2 "ORM / Migration") eklenmistir. Playwright ve Anthropic SDK ve
# APScheduler ise sirasiyla M3.1, M5.1, M9.5'te eklenecektir. TDD Section 26
# geregi kilitli (pinned) surum kullanilir. psycopg (psycopg3), SQLAlchemy 2.x
# ile onerilen modern PostgreSQL suruculugudur. PyYAML (M1.4), TDD Section
# 5/13'un config/*.yaml dosyalarini (system.defaults.yaml, accounts/*.yaml)
# okumak icin eklenmistir - standart, tek amacli YAML ayristirici.
#
# NOT (uretim oncesi): "psycopg[binary]" kendi libpq/OpenSSL kopyasini
# tasiyan onceden derlenmis bir wheel kullanir -- yerel gelistirme icin
# rahat ve hizlidir, ancak gercek bir uretim dagitimindan once, sistemin
# kendi libpq'suna baglanan kaynaktan derlenmis "psycopg" paketine
# gecmek (guvenlik yamalarinin isletim sistemi seviyesinde yonetilmesini
# saglar) bilincli olarak yeniden degerlendirilmelidir (bkz. Section 27).
#
# cryptography (M2.3), TDD Section 24'un "simetrik sifreleme" gereksinimini
# karsilar - Fernet (AES128-CBC + HMAC, dogrulanmis simetrik sifreleme),
# kendi kripto primitiflerimi yazmak yerine iyi-denetlenmis, endustri
# standardi bir kutuphane kullanir. keyring (M2.3), sifreleme ANAHTARINI
# (secret'larin kendisini degil) OS keychain'inde saklamak icin - TDD
# Section 24'un "anahtar OS keychain'den... alinir" secenegi. playwright
# (M3.1), TDD Section 2'nin "Tarayici Otomasyonu" secimi - LinkedIn'e
# oturum tabanli (storage_state) erisim icin. `playwright install
# chromium` ayrica calistirilmalidir (bu paket yalnizca Python
# bagimliligidir, tarayici ikili dosyalarini ayrica indirir). beautifulsoup4
# (M3.4), RecordExtractor'in M3.3'un urettigi ham ilan karti HTML
# dizelerinden FR-2'nin minimum alan setini (baslik, sirket, lokasyon,
# tarih, aciklama, link) cikarmasi icin - proje talimatiyla acikca
# onaylandi, yalnizca bu tek amac icin eklendi. Ek bir ayristirici backend
# (orn. lxml) KASITLI OLARAK eklenmedi - Python'in kendi yerlesik
# `html.parser`i BeautifulSoup icin yeterlidir (talimat: "yalnizca
# RecordExtractor icin gereken minimum bagimlilik").
dependencies = [
    "pydantic==2.13.4",
    "sqlalchemy==2.0.51",
    "alembic==1.19.0",
    "psycopg[binary]==3.3.4",
    "pyyaml==6.0.3",
    "cryptography==46.0.7",
    "keyring==25.7.0",
    "playwright==1.62.0",
    "beautifulsoup4==4.15.0",
]

# M1.4: `linkedinbot seed` komutunu (bkz. cli.py) dogrudan calistirilabilir
# kilar; pip install -e . sonrasi "linkedinbot" komutu PATH'e eklenir.
[project.scripts]
linkedinbot = "linkedinbot.cli:main"

# TDD Section 26 ("Baglilik hijyeni") geregi kilitli (pinned) surumler kullanilir.
# Yeni bir surume gecis bilincli bir degisiklik olarak yapilir, otomatik surum
# kaymasi (>=) ile degil.
[project.optional-dependencies]
dev = [
    "ruff==0.16.2",
    "pytest==9.1.1",
    "import-linter==2.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
# migrations/, Alembic'in kendi sablonuyla (alembic init / --autogenerate)
# uretilir; Alembic'in kendi konvansiyonlarindan elle saptirmamak icin lint
# kapsami disinda tutulur (standart pratik).
extend-exclude = ["migrations"]

# "S" (flake8-bandit) M1.2'de eklendi: kod tabaninda artik ham SQL (text())
# kullanimi var (kismi index WHERE kosullari, entegrasyon testleri); bu
# kural seti, gelecekte string birlestirme/formatlama yoluyla SQL
# enjeksiyonu riski tasiyan bir sorgu eklenirse erken uyari verir.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "S"]

# S101 (assert kullanimi), pytest'in kendi dogrulama mekanizmasidir --
# test dosyalarinda bir guvenlik riski degildir (bandit'in genel amacli,
# uretim kodu icin anlamli olan bir kuralinin test kodundaki bilinen
# yanlis-pozitifidir). S105 (M2.3'te eklendi - "olasi sabit-kodlanmis
# parola") ayni kategoridedir: SecretsProvider testleri kacinilmaz olarak
# sahte/test secret degerleri icerir (orn. "sk-ant-test-value") - bunlar
# GERCEK, sizdirilmis kimlik bilgileri degildir. Yalnizca tests/ icin
# devre disi birakilir; src/ altindaki uygulama kodu icin S kurallari
# tam olarak gecerli kalir.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# TDD Section 5 geregi: domain katmani hicbir zaman adapters katmanina bagimli
# olamaz (Hexagonal Architecture -- bkz. TDD Section 1 Karar 2, Section 3). Bu
# kural burada otomatik olarak denetlenir (bkz. TDD Section 26).
[tool.importlinter]
root_package = "linkedinbot"

[[tool.importlinter.contracts]]
name = "Domain katmani adapters'i import edemez"
type = "forbidden"
source_modules = ["linkedinbot.domain"]
forbidden_modules = ["linkedinbot.adapters"]

# M1.3: repository Port arayuzleri (linkedinbot.ports), TDD Section 3'un
# "Domain/Core yalnizca Port arayuzlerine bagimlidir" kuralinin somut
# karsiligidir -- bir Port hicbir zaman kendi somut implementasyonunu
# (db.repositories) veya baska bir adapter'i bilmemelidir, aksi halde
# soyutlama tersine doner (adapter'a bagimli bir "arayuz" anlamsizdir).
[[tool.importlinter.contracts]]
name = "Ports katmani somut db/adapters implementasyonlarini import edemez"
type = "forbidden"
source_modules = ["linkedinbot.ports"]
forbidden_modules = ["linkedinbot.db", "linkedinbot.adapters"]

# M2.2: AccountContext artik linkedinbot.config.schema'yi import ediyor (bkz.
# domain/account_context.py modul dokumani - TDD Section 14'un AccountContext
# tanimini yerine getirmek icin). config/schema.py'nin kendisi sifir altyapi
# bagimliligi olan saf bir Pydantic modulu olsa da, bu kontrat, GELECEKTE
# config/loader.py gibi DB'ye erisen bir config alt-modulunun yanlislikla
# domain'e (dogrudan veya baska bir domain modulu uzerinden) sizmasina karsi
# savunma derinligi saglar.
[[tool.importlinter.contracts]]
name = "Domain katmani db katmanini import edemez"
type = "forbidden"
source_modules = ["linkedinbot.domain"]
forbidden_modules = ["linkedinbot.db"]
