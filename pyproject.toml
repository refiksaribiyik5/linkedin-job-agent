[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedinbot"
version = "0.1.0"
description = "AI destekli, kisisel LinkedIn is ilani kesif ve degerlendirme sistemi (bkz. LinkedInBot-PRD.md, LinkedInBot-TDD.md)"
requires-python = ">=3.12"
authors = [{ name = "Refik Saribiyik" }]

# V1 kapsaminda calisma zamani bagimliligi henuz yoktur: bu milestone (M0.1) yalnizca
# paket/tooling iskeletini kurar. Playwright, SQLAlchemy, Pydantic, Anthropic SDK ve
# APScheduler gibi TDD Section 2'de secilen bagimliliklar, onlari fiilen kullanan ilk
# milestone'da (sirasiyla M3.1, M1.2, M1.1/M2.1, M5.1, M9.5) eklenir.
dependencies = []

# TDD Section 26 ("Baglilik hijyeni") geregi kilitli (pinned) surumler kullanilir.
# Yeni bir surume gecis bilincli bir degisiklik olarak yapilir, otomatik surum
# kaymasi (>=) ile degil.
[project.optional-dependencies]
dev = [
    "ruff==0.16.2",
    "pytest==9.1.1",
    "import-linter==2.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# TDD Section 5 geregi: domain katmani hicbir zaman adapters katmanina bagimli
# olamaz (Hexagonal Architecture -- bkz. TDD Section 1 Karar 2, Section 3). Bu
# kural burada otomatik olarak denetlenir (bkz. TDD Section 26).
[tool.importlinter]
root_package = "linkedinbot"

[[tool.importlinter.contracts]]
name = "Domain katmani adapters'i import edemez"
type = "forbidden"
source_modules = ["linkedinbot.domain"]
forbidden_modules = ["linkedinbot.adapters"]
