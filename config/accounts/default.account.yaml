# LinkedInBot - V1'in tek hesap tohum (seed) verisi (TDD Section 5).
#
# display_name/career_goals/skills_summary/preferences dogrudan account +
# user_profiles satirlarina yazilir (bkz. PRD Section 15.1, domain/user_profile.py).
#
# account_config_overrides, system.defaults.yaml'in UZERINE yazilan
# (shallow merge) hesaba-ozel degerlerdir - PRD Section 15.1/17'nin "Target
# Locations" ve "Report Format" gibi config-katmani kavramlarina karsilik
# gelir; UserProfile.preferences'in (yalnizca blacklist icin tanimli, bkz.
# domain/user_profile.py) PARCASI DEGILDIR.

